<style>
:root{--bg:#050d33;--panel:#0b1650;--panel2:#101e66;--line:#22338a;--tx:#eef3ff;--mut:#9fb0ee;--cy:#00c2ff;--bl:#0a5cff;--ok:#2ee59d;--bad:#ff5d73;--warn:#ffc14d;box-sizing:border-box;padding-top:0px}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef3ff;--panel:#fff;--panel2:#e3ebff;--line:#c4d2fb;--tx:#0a1450;--mut:#4a5a9c}}
:root[data-theme="light"]{--bg:#eef3ff;--panel:#fff;--panel2:#e3ebff;--line:#c4d2fb;--tx:#0a1450;--mut:#4a5a9c}
:root[data-theme="dark"]{--bg:#050d33;--panel:#0b1650;--panel2:#101e66;--line:#22338a;--tx:#eef3ff;--mut:#9fb0ee}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Outfit,Cairo,system-ui,sans-serif;min-height:100vh}
[dir=rtl] body{font-family:Cairo,Outfit,system-ui,sans-serif}
#app{display:flex;min-height:100vh}
aside{width:250px;background:var(--panel);border-inline-end:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px 14px;font-weight:700;font-size:22px;letter-spacing:.5px}
.logo small{display:block;font-size:10px;font-weight:400;color:var(--mut);letter-spacing:0}
.logo b{color:var(--cy)}
nav button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;color:var(--mut);font:inherit;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:start}
nav button:hover{background:var(--panel2);color:var(--tx)}
nav button.on{background:linear-gradient(90deg,var(--bl),var(--cy));color:var(--on,#fff);font-weight:600}
nav i{font-style:normal;width:20px;text-align:center}
.by{margin-top:auto;font-size:12px;color:var(--mut);padding:8px}
main{flex:1;padding:24px;min-width:0;max-width:1100px}
header.top{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
header.top h1{margin:0;font-size:26px;flex:1}
#burger{display:none}
button.b,.b{background:linear-gradient(135deg,var(--bl),var(--cy));color:var(--on,#fff);border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
button.g{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
button.d{background:none;border:1px solid var(--bad);color:var(--bad);border-radius:8px;padding:5px 10px;font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.stat b{display:block;font-size:30px;color:var(--cy)}
.stat span{color:var(--mut);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.card .grow{flex:1;min-width:160px}
.card h3{margin:0;font-size:16px}
.card p{margin:2px 0 0;color:var(--mut);font-size:13px;white-space:pre-wrap}
.av{width:52px;height:52px;border-radius:50%;background:var(--panel2) center/cover;border:2px solid var(--cy);display:grid;place-items:center;font-weight:700;color:var(--cy);flex:none}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:var(--panel2);border:1px solid var(--line)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:50;padding:16px}
.modal form{background:var(--panel);border:1px solid var(--cy);border-radius:16px;padding:20px;width:100%;max-width:460px;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
input,select,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg button{background:var(--panel2);border:1px solid var(--line);color:var(--mut);padding:6px 11px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
.seg button.on.present{background:var(--ok);color:#022;border-color:var(--ok)}
.seg button.on.absent{background:var(--bad);color:#fff;border-color:var(--bad)}
.seg button.on.rest{background:var(--bl);color:#fff;border-color:var(--bl)}
.seg button.on.late{background:var(--warn);color:#220;border-color:var(--warn)}
.empty{color:var(--mut);padding:30px;text-align:center;border:1px dashed var(--line);border-radius:14px}
h2{font-size:18px;margin:22px 0 10px}
.rep{background:#fff;color:#111;border:1px solid var(--line);border-radius:12px;padding:24px}
.rep h2,.rep h3{color:var(--bl);margin:14px 0 6px;font-size:14px;font-weight:700}
.rep table{width:100%;border-collapse:collapse;font-size:12px}
.rep td,.rep th{border-bottom:1px solid #ddd;padding:5px;text-align:start;font-size:12px}
.rep p,.rep span,.rep td,.rep th,.rep li{font-size:12px}
.status-present{color:#000;font-weight:700}
.status-absent{color:#d93025;font-weight:700}
.status-late{color:#c79100;font-weight:700}
.status-rest{color:#1a73e8;font-weight:700}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ok);color:#022;padding:8px 18px;border-radius:99px;font-weight:600;z-index:99}
@media(max-width:820px){aside{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-105%);transition:transform .2s}[dir=rtl] aside{inset:0 0 0 auto;transform:translateX(105%)}aside.open{transform:translateX(0)}main{padding:18px}#burger{display:inline-flex}.logo{padding-top:8px}}
@media print{.modal{position:static;background:none;display:block;padding:0}.modal form{border:0;max-height:none;overflow:visible;padding:0;background:none}body:has(.modal .rep) #app{display:none}body{background:#fff}.rep{border:0;box-shadow:none}.noprint{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="app"><aside id="sb"></aside><main id="mn"></main></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T={fr:{dash:'Tableau de bord',emp:'Employés',tasks:'Tâches',att:'Pointages',needs:'Besoins des magasins',recl:'Réclamations',gaps:'Manques de caisse',rep:'Rapport de fin de journée',set:'Paramètres',add:'Ajouter',save:'Enregistrer',cancel:'Annuler',date:'Date',who:'Employé',status:'Statut',title:'Titre',total:'Total',arrive:'Arrivée',start:'Heure de début',theme:'Thème',colors:'Couleurs',backup:'Sauvegarde',close:'Fermer',hist:'Historique',sure:'Êtes-vous sûr ?',saved:'Enregistré',done:'Terminé',pending:'En attente',client:'Client',employee:'Employé',present:'Présent',absent:'Absent',rest:'Repos',late:'Retard',matin:'Matin',soir:'Soir',shift:'Entrée',entry:'Heure de début de travail'},ar:{dash:'لوحة التحكم',emp:'الموظفون',tasks:'المهام',att:'الحضور',needs:'احتياجات المحلات',recl:'الشكاوى',gaps:'عجز الصندوق',rep:'تقرير نهاية اليوم',set:'الإعدادات',add:'إضافة',save:'حفظ',cancel:'إلغاء',date:'التاريخ',who:'الموظف',status:'الحالة',title:'العنوان',total:'الإجمالي',arrive:'الوقت',start:'وقت البداية',theme:'المظهر',colors:'الألوان',backup:'نسخة احتياطية',close:'إغلاق',hist:'السجل',sure:'هل أنت متأكد؟',saved:'تم الحفظ',done:'مكتمل',pending:'قيد الانتظار',client:'عميل',employee:'موظف',present:'حاضر',absent:'غائب',rest:'راحة',late:'متأخر',matin:'صباح',soir:'مساء',shift:'الدخول',entry:'وقت بداية العمل'}};
let S;try{S=JSON.parse(localStorage.getItem('libraos'))}catch(e){}
S=Object.assign({lang:'fr',owner:{name:'',phone:'',photo:'',shops:['Magasin 1'],extra:''},emp:[],tasks:[],att:{},needs:[],recl:[],gaps:[],reports:[]},S||{});
const save=()=>{try{localStorage.setItem('libraos',JSON.stringify(S))}catch(e){toast('Storage full')}};
const t=k=>T[S.lang][k]||k;
let view='dash',repDate=today(),attDate=today();
const NAV=[['dash','▦'],['emp','☺'],['tasks','✔'],['att','◷'],['needs','▤'],['recl','⚑'],['gaps','⚠'],['rep','▣'],['set','⚙']];
const empName=id=>{const e=S.emp.find(x=>x.id==id);return e?e.prenom+' '+e.nom:'—'};
const av=e=>`<div class="av" style="${e.photo?`background-image:url('${e.photo}')`:''}">${e.photo?'':esc((e.prenom||e.nom||'?')[0])}</div>`;
const fmtDT=v=>v?new Date(v).toLocaleString(S.lang==='ar'?'ar-DZ':'fr-FR',{dateStyle:'medium',timeStyle:'short'}):'';
const M={
emp:{f:[['nom','text'],['prenom','text'],['tel','tel'],['photo','photo'],['fonction','text'],['shift',['matin','soir']],['info','area']],row:e=>`${av(e)}<div class=grow><h3>${esc(e.prenom)} ${esc(e.nom)}</h3><p>${esc(e.fonction||'')} ${e.shift?`· ${t(e.shift)}`:''}</p></div>`},
tasks:{f:[['title','text'],['who','emp'],['when','datetime-local'],['done','chk']],row:x=>`<div class=grow><h3>${esc(x.title)}</h3><p>${esc(empName(x.who))} · ${fmtDT(x.when)}</p></div><button class=g onclick="tog('tasks','${x.id}','done')">${x.done?t('done'):t('pending')}</button>`},
needs:{f:[['shop','shop'],['item','text'],['qty','text'],['done','chk']],row:x=>`<div class=grow><h3>${esc(x.item)} ${x.qty?'× '+esc(x.qty):''}</h3><p>${esc(x.shop)}</p></div><button class=g onclick="tog('needs','${x.id}','done')">${x.done?t('done'):t('pending')}</button>`},
recl:{f:[['type',['client','employee']],['nom','text'],['subject','text'],['details','area'],['status',['open','closed']]],row:x=>`<div class=grow><h3>${esc(x.subject)} <span class=tag>${t(x.type)}</span></h3><p>${esc(x.nom)} · ${t(x.status)}</p></div><button class=g onclick="openForm('recl','${x.id}')">✎</button>`},
gaps:{f:[['date','date'],['agent','emp'],['amount','number'],['note','text']],row:x=>`<div class=grow><h3>${esc(empName(x.agent))}</h3><p>${esc(x.date)} ${esc(x.note)}</p></div><b class="${x.amount<0?'bad':'ok'}" dir=ltr>${x.amount} DA</b>`}
};
function tog(k,id,f){const x=S[k].find(a=>a.id==id);x[f]=!x[f];save();go(view)}
function list(k){let a=S[k];if(k=='gaps')a=[...a].sort((x,y)=>y.date.localeCompare(x.date));
let h=`<div class=row style="margin-bottom:14px"><button class=b onclick="openForm('${k}')">+ ${t('add')}</button></div>`;
if(k=='gaps'){const s=a.reduce((n,x)=>n+ +x.amount,0);h+=`<div class=stat style="cursor:default;margin-bottom:14px"><span>${t('total')}</span><b class="${s<0?'bad':'ok'}" dir=ltr>${s} DA</b></div>`}
h+=a.length?a.map(x=>`<div class=card>${M[k].row(x)}<button class=g onclick="openForm('${k}','${x.id}')">✎</button><button class=d onclick="rm('${k}','${x.id}')">✕</button></div>`).join(''):`<div class=empty>${t('none')||'Aucun élément'}</div>`;
$('#mn').innerHTML=h
}
function ask(msg,ok){const m=document.createElement('div');m.className='modal';m.innerHTML='<form><p style="margin:0">'+msg+'</p><div class=row><button class=b>OK</button><button type=button class=g onclick="this.closest(\'.modal\').remove()">'+t('cancel')+'</button></div></form>';m.querySelector('form').onsubmit=e=>{e.preventDefault();m.remove();ok&&ok()};document.body.appendChild(m)}
function rm(k,id){ask(t('sure'),()=>{S[k]=S[k].filter(x=>x.id!=id);save();go(view)})}
let tmpPhoto='';
function opts(f){if(Array.isArray(f))return f.map(v=>[v,t(v)]);if(f=='emp')return S.emp.map(e=>[e.id,e.prenom+' '+e.nom]);if(f=='shop')return S.owner.shops.map(s=>[s,s])}
function openForm(k,id){const x=id?S[k].find(a=>a.id==id):{};tmpPhoto=x.photo||'';
const def={date:today(),type:'client',status:'open'};
const fs=M[k].f.map(([n,ty])=>{const v=x[n]??def[n]??'';let i;
if(ty=='area')i=`<textarea name=${n} rows=3>${esc(v)}</textarea>`;
else if(ty=='photo')i=`<input type=file accept="image/*" onchange="pic(this)">${tmpPhoto?`<div class=av style="background-image:url('${tmpPhoto}')"></div>`:''}`;
else if(ty=='chk')i=`<input type=checkbox name=${n} ${v?'checked':''} style="width:22px;height:22px">`;
else if(typeof ty!='string'||ty=='emp'||ty=='shop'){const o=opts(ty);i=`<select name=${n}>${o.length?o.map(([a,b])=>`<option value="${esc(a)}" ${a==v?'selected':''}>${esc(b)}</option>`).join(''):'<option value="">—</option>'}</select>`}
else i=`<input name=${n} type=${ty} value="${esc(v)}" ${ty=='number'?'step=any':''} ${n=='tel'?'dir=ltr':''} ${['title','item','subject'].includes(n)||(k=='emp'&&n=='nom')?'required':''}>`;
return `<label>${t(n)}${i}</label>`}).join('');
const m=document.createElement('div');m.className='modal';
m.innerHTML=`<form><h2 style="margin:0">${t(k)}</h2>${fs}<div class=row><button class=b>${t('save')}</button><button type=button class=g onclick="this.closest('.modal').remove()">${t('cancel')}</button></div></form>`;
m.querySelector('form').onsubmit=e=>{e.preventDefault();const r=x.id?x:{id:uid()};
M[k].f.forEach(([n,ty])=>{const el=e.target.querySelector('[name="'+n+'"]');if(ty=='photo')r.photo=tmpPhoto;else if(ty=='chk')r[n]=el.checked;else r[n]=ty=='number'?+el.value||0:el.value});
if(!x.id)S[k].push(r);save();m.remove();go(view);toast(t('saved'))};
document.body.appendChild(m)}
function pic(inp,cb){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,200/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;const ctx=c.getContext('2d');ctx.drawImage(im,0,0,c.width,c.height);tmpPhoto=c.toDataURL('image/jpeg',0.82);inp.parentElement.querySelector('.av')?.remove();const n=document.createElement('div');n.className='av';n.style.backgroundImage=`url('${tmpPhoto}')`;inp.parentElement.appendChild(n)};im.src=r.result};r.readAsDataURL(f)}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),1600)}
const ST=['present','absent','rest','late'];
function setAtt(d,id,s){(S.att[d]??={})[id]??={};S.att[d][id].s=s;S.att[d][id].m=0;S.att[d][id].t=s=='late'?(S.att[d][id].t||''):'';save();go('att')}
function setTime(d,id,v){S.att[d][id].t=v;save()}
function lt(a){if(!a||a.s!='late')return '';if(!a.t)return a.m?' ('+a.m+' min)':'';let x=' · '+t('arrive')+' '+a.t;const st=S.owner.start;if(st){const df=(+a.t.slice(0,2)*60+ +a.t.slice(3))-(+st.slice(0,2)*60 + +st.slice(3));if(df>0)x+=' ('+Math.floor(df/60)+'h'+(df%60?' '+(df%60)+'m':'')+')'};return x}
function attView(){const d=attDate;let h=`<div class=row style="margin-bottom:14px"><label>${t('date')}<input type=date value="${d}" onchange="attDate=this.value||today();go('att')"></label></div>`;h+=S.emp.length?S.emp.map(e=>{const a=(S.att[d]||{})[e.id]||{};return `<div class=card>${av(e)}<div class=grow><h3>${esc(e.prenom)} ${esc(e.nom)}</h3><p>${esc(e.fonction)}</p></div><div class="seg">${ST.map(s=>`<button type=button class="${a.s==s?'on':''} ${s}" onclick="setAtt('${d}','${e.id}','${s}')">${t(s)}</button>`).join('')}</div>${a.s=='late'?`<label style="min-width:120px"><span>${t('arrive')}</span><input type=time value="${esc(a.t||'')}" onchange="setTime('${d}','${e.id}',this.value)"></label>`:''}</div>`}).join(''):`<div class=empty>${t('none')||'Aucun employé'}</div>`;const ds=Object.keys(S.att).sort().reverse();h+=`<h2>${t('hist')}</h2>`+ds.map(dt=>`<div class=card><b>${dt}</b><div class=grow>${S.emp.map(e=>{const a=S.att[dt][e.id];return a?`<span class=tag>${esc(e.prenom)}: ${t(a.s)}${lt(a)}</span> `:'<span class=tag>—</span> '}).join('')}</div></div>`).join('')||'<div class=empty>—</div>';$('#mn').innerHTML=h}
function dash(){const d=today(),pr=S.emp.filter(e=>['present','late'].includes(((S.att[d]||{})[e.id]||{}).s)).length,g=S.gaps.reduce((n,x)=>n+ +x.amount,0);const st=[['emp',S.emp.length,t('emp')],['att',pr+' / '+S.emp.length,t('att')],['tasks',S.tasks.filter(x=>!x.done).length,t('tasks')],['recl',S.recl.filter(x=>x.status!='closed').length,t('recl')],['needs',S.needs.filter(x=>!x.done).length,t('needs')],['gaps',g,t('gaps')]];return `<div class=grid>${st.map(([k,v,l])=>`<div class=stat onclick="go('${k}')"><b dir=ltr>${v}</b><span>${l}</span></div>`).join('')}</div><h2>${t('tasks')}</h2>`+(S.tasks.filter(x=>!x.done).length?S.tasks.filter(x=>!x.done).slice(0,5).map(x=>`<div class=card><div class=grow><h3>${esc(x.title)}</h3><p>${esc(empName(x.who))} · ${fmtDT(x.when)}</p></div></div>`).join(''):`<div class=empty>—</div>`)}
function build(d){const A=S.att[d]||{},tk=S.tasks.filter(x=>(x.when||'').slice(0,10)==d),gp=S.gaps.filter(x=>x.date==d),rc=S.recl.filter(x=>x.status!='closed'),nd=S.needs.filter(x=>!x.done),tg=gp.reduce((n,x)=>n+ +x.amount,0);const tb=(h,rows)=>rows.length?`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`:`<p>—</p>`;const st=(s)=>{if(!s)return '—';const map={present:'status-present',absent:'status-absent',late:'status-late',rest:'status-rest'};return `<span class="${map[s]||'status-present'}">${t(s)}</span>`};return `<div style="display:flex;align-items:center;gap:16px;border-bottom:2px solid var(--bl);padding-bottom:10px;margin-bottom:6px"><div style="flex:1"><h2 style="margin:0">${S.owner.name||'LIBRAOS'}</h2><p style="margin:2px 0 0;color:#666;font-size:12px">${d}</p></div>${S.owner.logo?`<img src="${S.owner.logo}" alt="logo" style="max-height:52px;max-width:140px;object-fit:contain;background:#fff;border-radius:8px;padding:4px;border:1px solid var(--line)">`:''}</div><h3>${t('att')}</h3>${tb([t('who'),t('status')],S.emp.map(e=>[e.prenom+' '+e.nom, A[e.id]?st(A[e.id].s):'—']))}<h3>${t('tasks')}</h3>${tb([t('title'),t('who'),t('status')],tk.map(x=>[x.title,empName(x.who),x.done?t('done'):t('pending')]))}<h3>${t('gaps')}</h3>${tb([t('agent'),t('amount'),t('note')],gp.map(x=>[empName(x.agent),x.amount+' DA',x.note]))}<p><b>${t('total')}: ${tg} DA</b></p><h3>${t('recl')}</h3>${tb([t('subject'),t('nom'),t('type')],rc.map(x=>[x.subject,x.nom,t(x.type)]))}<h3>${t('needs')}</h3>${tb([t('shop'),t('item'),t('qty')],nd.map(x=>[x.shop,x.item,x.qty]))}<p style="color:#888;font-size:11px;margin-top:16px">LIBRAOS</p>`}
function repView(){return `<div class="row noprint" style="margin-bottom:14px"><label>${t('date')}<input type=date value="${repDate}" onchange="repDate=this.value||today();go('rep')"></label><button class=b onclick="window.print()">PDF</button></div><div class=rep>${build(repDate)}</div><div class=noprint><h2>${t('hist')}</h2>${S.reports.length?[...S.reports].reverse().map(r=>`<div class=card><b>${r.date}</b><div class=grow><p>${new Date(r.saved).toLocaleString()}</p></div><button class=g onclick="viewRep('${r.id}')">${t('open')||'Voir'}</button></div>`).join(''):'<div class=empty>—</div>'}</div>`}
const PIX='data:image/gif;base64,R0lGODlhAQABAAAAACw=';
const keepLogo=h=>S.owner.logo?h.split(S.owner.logo).join('@@LOGO@@'):h;
function picLogo(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,400/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;const ctx=c.getContext('2d');ctx.drawImage(im,0,0,c.width,c.height);S.owner.logo=c.toDataURL('image/jpeg',0.82);save();go('set')};im.src=r.result};r.readAsDataURL(f)}
function rmLogo(){S.owner.logo='';save();go('set')}
function saveRep(){S.reports.push({id:uid(),date:repDate,saved:Date.now(),html:keepLogo(build(repDate))});save();go('rep');toast(t('saved'))}
function viewRep(id){const r=S.reports.find(x=>x.id==id),m=document.createElement('div');m.className='modal';m.innerHTML=`<form style="max-width:720px"><div class=rep>${r.html.split('@@LOGO@@').join(S.owner.logo||'')}</div><div class=row><button type=button class=g onclick="this.closest('.modal').remove()">${t('close')}</button></div></form>`;document.body.appendChild(m)}
function setView(){const o=S.owner;tmpPhoto=o.photo;return `<form class=card style="display:block;max-width:520px" onsubmit="saveSet(event)"><div class=row>${av({photo:o.photo,prenom:o.name})}<div class=grow><h3>${esc(o.name||'LIBRAOS')}</h3><p>${esc(o.phone||'')}</p></div></div><label>${t('name')||'Nom'}<input name=name value="${esc(o.name||'')}"></label><label>${t('phone')||'Téléphone'}<input name=phone type=tel value="${esc(o.phone||'')}" dir=ltr></label><label>${t('shops')}<input name=shops value="${esc((o.shops||['Magasin 1']).join(', '))}"></label><label>${t('info')}<textarea name=extra rows=3>${esc(o.extra||'')}</textarea></label><label>${t('start')}<input name=start type=time value="${esc(o.start||'')}"></label><div style="font-size:13px;color:var(--mut)">${t('colors')}</div><div class=row id=sw style="margin:6px 0 10px">${Object.entries(PAL).map(([k,p])=>`<button type=button data-k="${k}" class="g" onclick="setAccent('${k}')" style="background:linear-gradient(135deg,${p.a[0]},${p.a[1]});color:${p.on};border-color:${p.a[1]};min-width:64px">${p.n[S.lang]||k}</button>`).join('')}</div><label>${t('theme')}<select name=theme><option value="">Auto</option><option value=dark ${S.theme=='dark'?'selected':''}>Dark</option><option value=light ${S.theme=='light'?'selected':''}>Light</select></label><div class=row style="margin-top:12px"><button class=b>${t('save')}</button><button type=button class=g onclick="exp()">${t('backup')}</button><label class=g style="flex-direction:row;cursor:pointer"><input type=file accept="image/*" onchange="imp(this)" style="display:none">${t('import')||'Importer'}</label></div></form>`}
function saveSet(e){e.preventDefault();const q=n=>e.target.querySelector('[name="'+n+'"]').value,o=S.owner;o.name=q('name');o.phone=q('phone');o.shops=q('shops').split(',').map(x=>x.trim()).filter(Boolean);o.extra=q('extra');o.start=q('start');S.theme=e.target.querySelector('[name="theme"]').value;save();go('set')}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='libraos-backup-'+today()+'.json';a.click()}
function imp(i){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=='object'||Array.isArray(d))throw 0;S=Object.assign({lang:'fr',owner:{name:'',phone:'',photo:'',shops:['Magasin 1'],extra:''},emp:[],tasks:[],att:{},needs:[],recl:[],gaps:[],reports:[]},d);save();go('dash')}catch{toast('Invalid backup')}};r.readAsText(i.files[0])}
const PAL={blue:{n:{fr:'Bleu',ar:'أزرق'},a:['#00c2ff','#0a5cff'],on:'#fff',b:['#0b0d12','#151922','#1e2430','#323b4d']},violet:{n:{fr:'Violet',ar:'بنفسجي'},a:['#b388ff','#6a3df0'],on:'#fff',b:['#0f0a30','#1a1250','#251a6e','#42339c']},green:{n:{fr:'Vert',ar:'أخضر'},a:['#2ee59d','#0b9f5e'],on:'#022',b:['#04231a','#073526','#0c4a36','#1c7a58']},orange:{n:{fr:'Orange',ar:'برتقالي'},a:['#ffb02e','#ff6a00'],on:'#220',b:['#2a1204','#3d1d08','#552a0c','#8a4a1c']},rose:{n:{fr:'Rose',ar:'وردي'},a:['#ff7eb6','#e0286f'],on:'#fff',b:['#2a0618','#3f0c26','#56143a','#8f2a5e']},graphite:{n:{fr:'Graphite',ar:'رمادي'},a:['#9fb3c8','#5b7083'],on:'#0b0d12',b:['#0b0d12','#151922','#1e2430','#323b4d']}};
function applyTheme(){const r=document.documentElement.style,p=PAL[S.accent]||PAL.blue;r.setProperty('--cy',p.a[0]);r.setProperty('--bl',p.a[1]);r.setProperty('--on',p.on);const dark=S.theme=='dark'||(!S.theme&&!matchMedia('(prefers-color-scheme: light)').matches);['--bg','--panel','--panel2','--line'].forEach((v,i)=>p.b&&dark?r.setProperty(v,p.b[i]):r.removeProperty(v))}
function setAccent(k){S.accent=k;save();applyTheme();document.querySelectorAll('#sw button').forEach(b=>b.style.borderColor=b.dataset.k==k?'var(--tx)':'transparent')}
function go(v){view=v;document.documentElement.lang=S.lang;document.documentElement.dir=S.lang=='ar'?'rtl':'ltr';if(S.theme)document.documentElement.dataset.theme=S.theme;else delete document.documentElement.dataset.theme;applyTheme();document.title='LIBRAOS — '+t(v);$('#sb').classList.remove('open');$('#sb').innerHTML=`<div class=logo><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAHgAAABaCAYAAABzAJLvAAA0TElEQVR42u19eZxcZZX2c857q6qr13SSzgYJEJIACctI2IRgOgoICIrDdCs4UZhxQHAXHXEUugs/fyC[...]"><div><b>LIBRAOS</b><small>appli</small></div></div><nav>${NAV.map(([k,i])=>`<button class="${view==k?'on':''}" onclick="go('${k}')"><i>${i}</i>${t(k)}</button>`).join('')}</nav><div class=by>© 2026</div>`;const body=v=='dash'?dash():v=='att'?attView():v=='rep'?repView():v=='set'?setView():list(v);$('#mn').innerHTML=body;}
/* ---- Android (Capacitor) : share files instead of download / print ---- */
async function shareFile(name,data,mime){const C=window.Capacitor;if(!(C&&C.isNativePlatform&&C.isNativePlatform()))return false;try{const{Filesystem,Share}=C.Plugins;const r=await Filesystem.writeFile({path:name,data:btoa(unescape(encodeURIComponent(data))),directory:'CACHE'});await Share.share({title:name,url:r.uri});return true}catch{return false}}

const _pr=window.print.bind(window);
window.print=async function(){const r=document.querySelector('.modal .rep')||document.querySelector('.rep');if(!r)return _pr();const h='<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIBRAOS</title><style>body{font-family:Arial,sans-serif;background:#fff;color:#111;margin:24px}h2,h3{color:#0a5cff;margin:16px 0 8px;font-size:14px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{border-bottom:1px solid #ddd;padding:6px;text-align:left;font-size:12px}.status-present{color:#000;font-weight:700}.status-absent{color:#d93025;font-weight:700}.status-late{color:#c79100;font-weight:700}.status-rest{color:#1a73e8;font-weight:700}</style></head><body>'+r.outerHTML+'</body></html>';
if(!await shareFile('rapport-'+today()+'.pdf',h,'application/pdf')){const w=window.open('','_blank','noopener');if(w){w.document.write(h);w.document.close();w.focus();setTimeout(()=>w.print(),300)}}};
go('dash');
