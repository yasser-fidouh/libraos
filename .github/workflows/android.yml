name: Build LIBRAOS APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate project
        id: d
        run: |
          f=$(find . -name capacitor.config.json -not -path '*/node_modules/*' | head -1)
          if [ -z "$f" ]; then echo "capacitor.config.json not found in the repository"; ls -R | head -50; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
        working-directory: ${{ steps.d.outputs.dir }}
      - name: Create Android project (only if missing)
        run: '[ -d android ] || npx cap add android'
        working-directory: ${{ steps.d.outputs.dir }}
      - name: Install LIBRAOS app icon
        working-directory: ${{ steps.d.outputs.dir }}
        run: |
          test -d icons/res || { echo "ERROR: icons/res folder is missing next to capacitor.config.json"; exit 1; }
          find android/app/src/main/res -name "ic_launcher*.webp" -delete
          cp -r icons/res/* android/app/src/main/res/
          echo "Icon installed:"; ls android/app/src/main/res/mipmap-xxxhdpi
      - run: npx cap sync android
        working-directory: ${{ steps.d.outputs.dir }}
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: ${{ steps.d.outputs.dir }}/android
      - uses: actions/upload-artifact@v4
        with:
          name: LIBRAOS-apk
          path: ${{ steps.d.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
