name: Build LIBRAOS APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate project
        id: d
        run: |
          f=$(find . -name capacitor.config.json -not -path '*/node_modules/*' | head -1)
          if [ -z "$f" ]; then echo "capacitor.config.json not found in the repository"; ls -R | head -50; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
        working-directory: ${{ steps.d.outputs.dir }}
      - name: Create Android project (only if missing)
        run: '[ -d android ] || npx cap add android'
        working-directory: ${{ steps.d.outputs.dir }}
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Install LIBRAOS app icon
        working-directory: ${{ steps.d.outputs.dir }}
        shell: bash
        run: |
          set -e

          # If icons are missing, generate simple placeholders so CI doesn't fail.
          for f in icon.png icon-foreground.png; do
            if [ ! -f "$f" ]; then
              echo "NOTICE: $f missing — generating placeholder"
              if [ "$f" = "icon.png" ]; then
                convert -size 1024x1024 canvas:"#041A55" -gravity center -font DejaVu-Sans -pointsize 300 -fill white -annotate 0 "L" "$f"
              else
                convert -size 1024x1024 canvas:none -gravity center -font DejaVu-Sans -pointsize 200 -fill white -annotate 0 "●" "$f"
              fi
            fi
          done

          R=android/app/src/main/res
          find $R -name "ic_launcher*.webp" -delete
          for p in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read d l f <<< "$p"
            mkdir -p $R/mipmap-$d
            convert icon.png -resize ${l}x${l} $R/mipmap-$d/ic_launcher.png
            cp $R/mipmap-$d/ic_launcher.png $R/mipmap-$d/ic_launcher_round.png
            convert icon-foreground.png -resize ${f}x${f} $R/mipmap-$d/ic_launcher_foreground.png
          done

          mkdir -p $R/mipmap-anydpi-v26 $R/values
          for n in ic_launcher ic_launcher_round; do
          cat > $R/mipmap-anydpi-v26/$n.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          done
          cat > $R/values/ic_launcher_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#041A55</color>
          </resources>
          XML
          echo "Icon installed:"; ls $R/mipmap-xxxhdpi || true
      - run: npx cap sync android
        working-directory: ${{ steps.d.outputs.dir }}
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: ${{ steps.d.outputs.dir }}/android
      - uses: actions/upload-artifact@v4
        with:
          name: LIBRAOS-apk
          path: ${{ steps.d.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
